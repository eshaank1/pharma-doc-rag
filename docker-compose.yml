services:
  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - EMBED_MODEL_NAME=${EMBED_MODEL_NAME:-all-MiniLM-L6-v2}
      - GRADIO_SERVER_NAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
